[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/daycare/onboarding/*"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/api/*"
  to = "https://chabad-yafo-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

